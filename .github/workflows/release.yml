name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    defaults:
      run:
        working-directory: apps/chetris

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - run: npm install

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/chetris
          tagName: ${{ github.ref_name }}
          releaseName: "CHATRIS ${{ github.ref_name }}"
          releaseBody: |
            ## CHATRIS ${{ github.ref_name }}

            ### 다운로드

            | 파일 | 설명 |
            |------|------|
            | **`CHATRIS-portable.exe`** | **포터블 (추천)** — 설치 없이 바로 실행 |
            | `CHATRIS_*_x64-setup.exe` | NSIS 설치 프로그램 (WebView2 포함) |
            | `CHATRIS_*_x64_en-US.msi` | MSI 설치 프로그램 |

            > 포터블 실행 시 Windows 10 21H2+ / Windows 11에 기본 포함된 WebView2가 필요합니다.
            > 트레이 아이콘 우클릭 → 자동 시작 설정 가능.
          releaseDraft: false
          prerelease: false

      - name: Upload portable exe + updater artifacts
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          # 포터블 exe
          cp src-tauri/target/release/chatris.exe "CHATRIS-portable.exe"
          gh release upload "$TAG" "CHATRIS-portable.exe" --clobber

          # updater용 nsis.zip + sig
          NSIS_DIR="src-tauri/target/release/bundle/nsis"
          NSIS_ZIP="${NSIS_DIR}/CHATRIS_${VERSION}_x64-setup.nsis.zip"
          NSIS_SIG="${NSIS_ZIP}.sig"

          if [ -f "$NSIS_ZIP" ] && [ -f "$NSIS_SIG" ]; then
            NSIS_NAME=$(basename "$NSIS_ZIP")
            gh release upload "$TAG" "$NSIS_ZIP" --clobber
            gh release upload "$TAG" "$NSIS_SIG" --clobber

            # latest.json 생성
            SIG_CONTENT=$(cat "$NSIS_SIG")
            PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            DOWNLOAD_URL="https://github.com/tellang/digital-fidget-spinner/releases/download/$TAG/$NSIS_NAME"

            printf '{\n  "version": "%s",\n  "notes": "CHATRIS %s",\n  "pub_date": "%s",\n  "platforms": {\n    "windows-x86_64": {\n      "signature": "%s",\n      "url": "%s"\n    }\n  }\n}\n' \
              "$VERSION" "$TAG" "$PUB_DATE" "$SIG_CONTENT" "$DOWNLOAD_URL" > latest.json

            cat latest.json
            gh release upload "$TAG" latest.json --clobber
            echo "✓ latest.json uploaded"
          else
            echo "⚠ nsis.zip or sig not found, skipping updater"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
